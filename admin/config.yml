      - { name: SeriesName, label: Name, widget: string, required: true }
      - { name: TitleEN, label: "Name englisch", widget: string, required: false, hint: "Steht so auf der Website." }
      - { name: Publish, label: Auf der Website zeigen, widget: boolean, default: false }
      - { name: StartYear, label: "Begonnen", widget: number, value_type: int, min: 1990, max: 2100, required: false }
