  # ── Seiten ─────────────────────────────────────────────────────────────────
  # Drei feste Notizen (Lebenslauf deutsch und englisch, Impressum). Nichts
  # anzulegen, nichts zu loeschen.
  - name: pages
    label: Seiten
    label_singular: Seite
    folder: Pages
    create: false
    delete: false
    identifier_field: name
    summary: "{{filename}}"
    fields:
      - { name: type, widget: hidden, default: text }
      - { name: name, label: Name, widget: string, required: false }
      - { name: email, label: "E-Mail", widget: string, required: false }
      - { name: instagram, label: Instagram, widget: string, required: false }
      - { name: geboren, label: Geboren, widget: string, required: false }
      - { name: geburtsland, label: Geburtsland, widget: string, required: false }
      - { name: lebt_in, label: "Lebt in", widget: string, required: false }
      - { name: adresse, label: Adresse, widget: string, required: false }
      - name: body
        label: Text
        widget: markdown
        modes: [raw]
        required: false
