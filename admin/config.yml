        modes: [raw]
        required: false
        hint: "Am Ende stehen Dataview-Blöcke in ```-Zäunen. Die gehören Obsidian — bitte stehen lassen."

  # ── Orte ───────────────────────────────────────────────────────────────────
  # Ohne Textfeld: der Fließtext dieser Notizen besteht praktisch nur aus
  # Dataview-Blöcken. Sveltia laesst ihn unangetastet, wenn er hier fehlt.
  - name: venues
