# ─────────────────────────────────────────────────────────────────────────────
# Aus dem Vault erzeugt. Nicht von Hand aendern — die Datei wird bei jedem
# Build neu geschrieben, damit die Auswahllisten nicht vom Vault abdriften.
# Quelle: src/admin/config.yml.njk, Listen aus lib/vault.js (cms).
#
# Grundsatz: Obsidian bleibt die Quelle. Dieses CMS schreibt in dieselben
# Markdown-Dateien. Felder, die hier nicht stehen, bleiben beim Speichern
# unangetastet — Sveltia uebernimmt den Rest der Datei unveraendert.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: studiooswald/Lisa-vault
  branch: main
  # Noch kein Anmelde-Helfer eingetragen (lib/site.json → cmsAuthUrl).
  # Solange gilt: nur „Mit Zugriffstoken anmelden" funktioniert.
  commit_messages:
    create: "{{collection}} angelegt: {{slug}}"
    update: "{{collection}} geaendert: {{slug}}"
    delete: "{{collection}} geloescht: {{slug}}"
    uploadMedia: "Bild hinzugefuegt: {{path}}"
    deleteMedia: "Bild entfernt: {{path}}"

# Bilder landen flach in der Bilddatenbank. Die Datenschicht findet ein Bild
# ueber seinen Dateinamen, der Unterordner ist reine Ordnung — einsortieren
# kann man spaeter in Obsidian, ohne dass etwas bricht.
media_folder: "Image Database"
public_folder: "Image Database"

# Dateinamen: Umlaute bleiben, Leerzeichen werden zu Bindestrichen.
slug:
  encoding: unicode
  clean_accents: false



collections:
  # ── Werke ──────────────────────────────────────────────────────────────────
  - name: works
    label: Arbeiten
    label_singular: Arbeit
    folder: Works
    path: "{{Year}}/{{slug}}"
    slug: "{{Title}}"
    identifier_field: Title
    summary: "{{Title}} · {{Year}}"
    create: true
    sortable_fields: [Year, Title]
    fields:
      - { name: type, widget: hidden, default: work }
      - { name: Title, label: Titel, widget: string, required: true }
      - { name: Year, label: Jahr, widget: number, value_type: int, min: 1990, max: 2100, required: true }
      - name: Publish
        label: Auf der Website zeigen
        widget: boolean
        default: false
        hint: "Solange das aus ist, steht die Arbeit nur im Vault."
      - { name: Featured, label: Hervorgehoben, widget: boolean, default: false, required: false }
